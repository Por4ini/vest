services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: vestwell
      POSTGRES_USER: vestwell
      POSTGRES_PASSWORD: vestwell
    volumes:
      - vestwell_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vestwell -d vestwell"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://vestwell:vestwell@db:5432/vestwell
      UPLOAD_DIR: /app/data/uploads
      RESULT_DIR: /app/data/results
      LOG_DIR: /app/data/logs
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read(); sys.exit(0)\""]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

  gateway:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "3006:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro


volumes:
  vestwell_db_data:
  app_data:
